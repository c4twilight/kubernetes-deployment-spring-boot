apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-demo-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-demo-app
  template:
    metadata:
      labels:
        app: backend-demo-app
    spec:
      containers:
        - name: backend-demo-app
          image: mohdtalib/backend-demo-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-demo-config
                  key: spring_datasource_url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-demo-secrets
                  key: spring_datasource_username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-demo-secrets
                  key: spring_datasource_password
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
